<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Algorithm Arena</title>
  <desc>Ten turning ribbons form an open, luminous rosette.</desc>
  <style>
    .rosette { transform-origin:32px 32px; animation:turn 24s linear infinite; }
    @keyframes turn { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .rosette { animation:none; } }
  </style>
